# Fork-owned local Keycloak for SSO development. Not part of the upstream
# selfhost/dev stack. Run: docker compose -f docker/keycloak/docker-compose.yml up -d
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: "8080"
    volumes:
      - ./realm-devhi.json:/opt/keycloak/data/import/realm-devhi.json:ro
    ports:
      - "127.0.0.1:8081:8080"
